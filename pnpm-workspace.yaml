packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/vite-plugin": ^1.54.4
  "@graphql-codegen/cli": ^7.4.1
  "@graphql-codegen/typescript": ^6.1.0
  "@graphql-codegen/typescript-graphql-request": ^7.1.0
  "@graphql-codegen/typescript-operations": ^6.1.6
  "@hono/mcp": ^0.3.2
  "@hono/zod-openapi": ^1.6.3
  "@hpke/chacha20poly1305": ^1.7.1
  "@hpke/core": ^1.7.5
  "@modelcontextprotocol/sdk": ^1.30.0
  "@types/node": ^24
  canonicalize: ^2.1.0
  commander: ^15.0.0
  cross-keychain: ^1.1.0
  flat-cache: ^6.1.23
  # GraphQL Mesh / Hive Gateway peer-depends on graphql ^15.9 || ^16.9
  graphql: ^16.9.0
  graphql-request: ^7.4.0
  graphql-tag: ^2.12.7
  dataloader: ^2.2.3
  "@graphql-codegen/typescript-generic-sdk": ^5.0.1
  "@graphql-mesh/compose-cli": ^1.8.2
  "@graphql-mesh/transport-http": ^1.2.1
  "@graphql-mesh/types": ^0.107.1
  "@graphql-hive/gateway-runtime": ^2.12.1
  hono: ^4.13.7
  hono-problem-details: ^0.11.0
  jsonc-parser: ^3.3.1
  picocolors: ^1.1.1
  typescript: ^7.0.2
  uqr: ^0.1.3
  uuid: ^14.0.2
  bs58: ^6.0.0
  viem: ^2.56.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  wrangler: ^4.129.0
  zod: ^4.6.5
  zod-commander: ^0.2.0
  "@privy-io/node": ^0.35.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@apollo/protobufjs": false
  "@reown/appkit": false
  bufferutil: false
  es5-ext: false
  esbuild: true
  keccak: false
  utf-8-validate: false
  workerd: true
minimumReleaseAgeExclude:
  - cn@0.2.5
