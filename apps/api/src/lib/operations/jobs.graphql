fragment JobActivity on JobEvent {
  kind
  actor {
    address: id
  }
  amount
  timestamp
  txHash: transactionHash
}

# providerAgent is stitched across the erc-8004 subgraph from providerAgentId
# by src/lib/mesh/resolvers.ts; the resolver always fetches this selection.
fragment JobSummary on Job {
  jobId
  status
  client {
    address: id
  }
  provider {
    address: id
  }
  evaluator {
    address: id
  }
  providerAgentId
  assignedAgent {
    id: agentId
    registration {
      name
      image
    }
  }
  description
  deliverable
  completionReason
  rejectionReason
  budget
  paymentToken
  expiresAt
  createdAt
  updatedAt
  activities: events(first: 1000, orderBy: timestamp, orderDirection: asc) {
    ...JobActivity
  }
}

query ListJobs($first: Int, $skip: Int, $where: Job_filter) {
  jobs(first: $first, skip: $skip, orderBy: jobId, orderDirection: asc, where: $where) {
    ...JobSummary
  }
}

query GetJob($jobId: BigInt!) {
  jobs(first: 1, where: { jobId: $jobId }) {
    ...JobSummary
  }
}
