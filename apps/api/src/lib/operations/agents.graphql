# Agent.registration resolves through the AgentRegistrationData interface, and
# the deployed subgraph errors at the store level when the field is null. All
# queries filter on registration_not: null, and single-agent queries use the
# list field with an id filter so agents without a registration return [].
# Space Object agents keep their whole card onchain as a data: URI, so every query
# also filters on agentURIKind: DATA — agents hosted elsewhere are invisible
# to the API. Burned agent NFTs are likewise invisible: every query filters on
# isBurned: false, so single-agent routes 404 for them. The list and search
# filters are built in the handler instead of
# inline here: a null variable inside a `where` object matches "field is null"
# rather than being ignored, so an omitted $owner would filter out every agent.
fragment AgentSummary on Agent {
  id: agentId
  owner {
    address: id
  }
  profile: registration {
    name
    description
    image
  }
  metadata {
    key
    value
  }
  agentURI
  feedbackCount: activeFeedbackCount
  createdAt
  createdAtTransaction
}

# reputationSample feeds the aggregates on the agent profile. The subgraph has
# no sum/avg fields, so the handler averages over the most recent 1000 active
# entries; activeFeedbackCount keeps the total exact regardless.
query GetAgent($id: Bytes!) {
  agents(
    first: 1
    where: { id: $id, registration_not: null, agentURIKind: DATA, isBurned: false }
  ) {
    ...AgentSummary
    reputationSample: feedback(
      first: 1000
      orderBy: createdAt
      orderDirection: desc
      where: { isRevoked: false }
    ) {
      value
      valueDecimals
      tag1
      tag2
    }
  }
}

query ListAgents($first: Int, $skip: Int, $where: Agent_filter) {
  agents(first: $first, skip: $skip, orderBy: agentId, orderDirection: asc, where: $where) {
    ...AgentSummary
  }
}

query SearchAgentProfiles(
  $text: String!
  $first: Int
  $skip: Int
  $where: AgentRegistration_filter
) {
  agentProfileSearch(text: $text, first: $first, skip: $skip, where: $where) {
    agent {
      ...AgentSummary
    }
  }
}

query GetAgentServices($id: Bytes!) {
  agents(
    first: 1
    where: { id: $id, registration_not: null, agentURIKind: DATA, isBurned: false }
  ) {
    registration {
      ... on AgentRegistration {
        services(orderBy: position, orderDirection: asc) {
          id
          name
          kind
          endpoint
          version
          features(orderBy: position, orderDirection: asc) {
            kind
            value
          }
          attributes(orderBy: position, orderDirection: asc) {
            key
            value
            valueType
          }
        }
      }
    }
  }
}

query GetAgentFeedbacks($id: Bytes!, $first: Int, $skip: Int, $where: Feedback_filter) {
  agents(
    first: 1
    where: { id: $id, registration_not: null, agentURIKind: DATA, isBurned: false }
  ) {
    feedback(first: $first, skip: $skip, orderBy: createdAt, orderDirection: desc, where: $where) {
      id
      feedbackIndex
      client {
        address: id
      }
      value
      valueDecimals
      tag1
      tag2
      feedbackURI
      isRevoked
      createdAt
      createdAtTransaction
    }
  }
}
